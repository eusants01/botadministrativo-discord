name: Sant's Commit Monitor
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar sintaxe Python
        id: check
        continue-on-error: true
        run: python -m compileall -q main.py painel.py portal_ext.py cogs utils
      - name: Publicar registro no Discord
        if: always()
        env:
          COMMIT_WEBHOOK: ${{ secrets.LOGS_COMMIT_WEBHOOK_URL }}
          ERROR_WEBHOOK: ${{ secrets.LOGS_ERROS_WEBHOOK_URL }}
          SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          SERVER_URL: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
          COMPARE_URL: ${{ github.event.compare }}
          CHECK_RESULT: ${{ steps.check.outcome }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          HEAD_COMMIT_JSON: ${{ toJSON(github.event.head_commit) }}
          COMMITS_JSON: ${{ toJSON(github.event.commits) }}
        run: python scripts/notify_commit.py
      - name: Reprovar workflow se houver erro
        if: steps.check.outcome == 'failure'
        run: exit 1